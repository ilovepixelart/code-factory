name: Install gitleaks
description: gitleaks for linux x64, checked against its published checksums.
runs:
  using: composite
  steps:
    - name: Download and verify gitleaks
      shell: bash
      run: |
        tool_dir="$RUNNER_TEMP/tools"
        mkdir -p "$tool_dir"
        cd "$tool_dir"
        release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
        asset=gitleaks_8.30.1_linux_x64.tar.gz
        curl --fail --silent --show-error --location --remote-name "$release/$asset"
        curl --fail --silent --show-error --location --remote-name "$release/gitleaks_8.30.1_checksums.txt"
        awk -v asset="$asset" '$2 == asset { print }' gitleaks_8.30.1_checksums.txt | sha256sum --check
        tar -xzf "$asset" gitleaks
        echo "$tool_dir" >> "$GITHUB_PATH"
