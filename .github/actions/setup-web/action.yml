name: Set up the web toolchain
description: Node 26 and pnpm for the web app.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '26'
    - name: Install pnpm
      shell: bash
      run: npm install --global pnpm@12.14.0
