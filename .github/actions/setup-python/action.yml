name: Set up Python
description: uv, which installs the pinned Python and the locked dependencies when the gate prepares.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: '0.13.9'
    # /tmp is shared by every user (sticky, written by all), so the board never trusts a program
    # below it (platform/programs.py), and the settings tests need folders outside /home: the
    # tests' temporary files go in a folder of the runner's own, right below /.
    - name: Keep temporary files in a folder of the runner's own
      shell: bash
      run: |
        sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /runner-tmp
        echo "TMPDIR=/runner-tmp" >> "$GITHUB_ENV"
