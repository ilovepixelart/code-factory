name: Verify

# Each part of the gate runs as its own job, side by side, through `scripts/gate.sh --part`: the
# same commands as the local gate. The pytest jobs leave their coverage data; `coverage` combines
# it, checks the floor once over the whole suite and sends the reports to SonarCloud.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_REF: ${{ github.base_ref || 'main' }}
  CODE_FACTORY_TEST_WORKERS: '3'
  CODE_FACTORY_WEB_TEST_WORKERS: '2'
  PYTEST_TIMEOUT: '90'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/gitleaks
      - name: Scan all reachable Git history
        run: gitleaks git --redact=100 --log-opts='--all'
      - name: Run the static checks
        run: sh scripts/gate.sh --force --base "refs/remotes/origin/$BASE_REF" --secrets --part static

  unit:
    name: Backend unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Run the backend-unit tests
        run: sh scripts/gate.sh --force --base "refs/remotes/origin/$BASE_REF" --part backend-unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE_FILE: .coverage.integration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/runtime
      - name: Verify the Linux check sandbox
        run: |
          uv sync --locked
          CODE_FACTORY_DATABASE_URL="$CODE_FACTORY_GATE_DATABASE_URL" \
            uv run --no-sync pytest -q --no-cov -n 1 tests/integration/checks/test_checks_composed.py
      - name: Run the backend-integration tests
        run: sh scripts/gate.sh --force --base "refs/remotes/origin/$BASE_REF" --part backend-integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Backend e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE_FILE: .coverage.e2e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/runtime
      - name: Run the backend-e2e tests
        run: sh scripts/gate.sh --force --base "refs/remotes/origin/$BASE_REF" --part backend-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e
          path: .coverage.e2e
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-web
      - name: Run the web checks and the build
        run: sh scripts/gate.sh --force --base "refs/remotes/origin/$BASE_REF" --part web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-web
      - name: Audit the locked dependencies
        run: |
          uv sync --locked
          sh scripts/audit.sh
          uv audit --project site --locked --preview-features audit-command
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web audit

  release:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/runtime
      - name: Build and verify a clean installation
        run: |
          uv sync --locked
          sh scripts/build_release.sh
          uv run --no-sync python scripts/check_release.py dist/*.whl

  compose:
    name: Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/check_compose.py

  coverage:
    name: Coverage and SonarCloud
    needs: [unit, integration, e2e, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine the coverage and check the floor
        run: |
          uv sync --locked
          uv run --no-sync coverage combine .coverage.unit .coverage.integration .coverage.e2e
          uv run --no-sync coverage report --skip-covered
          uv run --no-sync coverage xml -o coverage/python.xml
      # vitest writes lcov paths relative to web/, and the scanner resolves them from the root.
      - name: Write the web coverage for SonarCloud
        run: sed 's#^SF:#SF:web/#' lcov.info > coverage/web.info
      # Skipped when SONAR_TOKEN is absent (forks, Dependabot), so the check stays green there.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=code-factory
            -Dsonar.projectKey=ilovepixelart_code-factory
            -Dsonar.python.version=3.14
            -Dsonar.python.coverage.reportPaths=coverage/python.xml
            -Dsonar.javascript.lcov.reportPaths=coverage/web.info
            -Dsonar.exclusions=scripts/**,site/**,web/perf/**,web/demo/**,web/public/**,.code-factory/**,.github/**,Dockerfile,src/code_factory/platform/db/alembic/**,src/code_factory/platform/web/static/docs-assets/swagger-ui/**,web/src/components/ui/**,web/src/styles/shadcn-vue.css,web/src/generated/**,web/tests/**,**/*.test.ts,**/*.spec.ts,**/*.json
            -Dsonar.coverage.exclusions=web/src/main.ts
