name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/check_compose.py

  integration:
    name: Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CODE_FACTORY_TEST_WORKERS: '3'
      CODE_FACTORY_WEB_TEST_WORKERS: '2'
      PYTEST_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - name: Install Ubuntu runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql bubblewrap socat ripgrep libatomic1 gh
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Hosted test VMs need capability-bearing namespaces for srt's nested seccomp filter.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
      - name: Install tools and start an isolated test database
        shell: bash
        run: |
          npm install --global pnpm@12.14.0
          # Factory only starts runtimes from paths with known writers.
          runtime_tools="$HOME/.local/code-factory-ci"
          install -d -m 700 "$runtime_tools/bin"
          install -m 755 "$(command -v node)" "$runtime_tools/bin/node"
          npm install --global --prefix "$runtime_tools" @anthropic-ai/sandbox-runtime@0.0.83
          echo "$runtime_tools/bin" >> "$GITHUB_PATH"
          pg_bin="$(pg_config --bindir)"
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          tool_dir="$RUNNER_TEMP/tools"
          mkdir -p "$tool_dir"
          (
            cd "$tool_dir"
            release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
            asset="gitleaks_8.30.1_linux_$arch.tar.gz"
            curl --fail --silent --show-error --location --remote-name "$release/$asset"
            curl --fail --silent --show-error --location --remote-name "$release/gitleaks_8.30.1_checksums.txt"
            awk -v asset="$asset" '$2 == asset { print }' gitleaks_8.30.1_checksums.txt | sha256sum --check
            tar -xzf "$asset" gitleaks
          )
          echo "$tool_dir" >> "$GITHUB_PATH"
          echo "$pg_bin" >> "$GITHUB_PATH"
          pg_state="$RUNNER_TEMP/code-factory-postgres"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          pwfile="$(mktemp)"
          chmod 600 "$pwfile"
          printf '%s\n' "$password" > "$pwfile"
          "$pg_bin/initdb" -D "$pg_state" --username=postgres --pwfile="$pwfile" --auth=scram-sha-256
          rm "$pwfile"
          "$pg_bin/pg_ctl" -D "$pg_state" -l "$RUNNER_TEMP/postgres.log" -o '-h 127.0.0.1 -p 54320 -k /tmp' -w start
          PGPASSWORD="$password" "$pg_bin/createdb" -h 127.0.0.1 -p 54320 -U postgres code_factory_test
          printf 'CODE_FACTORY_GATE_DATABASE_URL=postgresql+asyncpg://postgres:%s@127.0.0.1:54320/code_factory_test\n' "$password" >> "$GITHUB_ENV"
      - name: Verify Linux check sandbox
        run: |
          uv sync --locked
          CODE_FACTORY_DATABASE_URL="$CODE_FACTORY_GATE_DATABASE_URL" \
            uv run --no-sync pytest -q --no-cov -n 1 tests/checks/test_checks_composed.py
      - name: Scan all reachable Git history
        run: gitleaks git --redact=100 --log-opts='--all'
      - name: Run the full gate
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: sh scripts/gate.sh --force --secrets --base "refs/remotes/origin/$BASE_REF"
      # vitest writes lcov paths relative to web/, and the scanner resolves them from the root.
      - name: Write coverage reports for SonarCloud
        if: matrix.os == 'ubuntu-24.04'
        run: |
          uv run --no-sync coverage xml --fail-under=0 -o coverage/python.xml
          sed 's#^SF:#SF:web/#' web/coverage/lcov.info > coverage/web.info
      # Skipped when SONAR_TOKEN is absent (forks, Dependabot), so the check stays green there.
      # One analysis per commit: the ubuntu-24.04 leg.
      - name: SonarCloud scan
        if: matrix.os == 'ubuntu-24.04' && env.SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=code-factory
            -Dsonar.projectKey=ilovepixelart_code-factory
            -Dsonar.python.version=3.14
            -Dsonar.python.coverage.reportPaths=coverage/python.xml
            -Dsonar.javascript.lcov.reportPaths=coverage/web.info
            -Dsonar.exclusions=web/src/components/ui/**,web/src/styles/shadcn-vue.css,web/src/generated/**,src/code_factory/platform/web/static/docs-assets/swagger-ui/**,site/web/static/code.css,site/web/static/js/htmx.min.js
      - name: Audit the locked dependencies
        run: |
          sh scripts/audit.sh
          uv audit --project site --locked --preview-features audit-command
          pnpm --dir web audit
      - name: Run browser smoke tests
        run: |
          pnpm --dir web exec playwright install --with-deps chromium
          CODE_FACTORY_DATABASE_URL="$CODE_FACTORY_GATE_DATABASE_URL" CODE_FACTORY_E2E_BUILT=1 \
            pnpm --dir web exec playwright test e2e/served_app.spec.ts e2e/core_flow.spec.ts e2e/demo_pages.spec.ts --workers=2
      - name: Build and verify a clean installation
        run: |
          sh scripts/build_release.sh
          uv run --no-sync python scripts/check_release.py dist/*.whl
      - name: Stop PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/code-factory-postgres/postmaster.pid" ]; then
            pg_ctl -D "$RUNNER_TEMP/code-factory-postgres" -m fast -w stop
          fi
